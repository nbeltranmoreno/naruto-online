<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Placa de la banda ninja: fondo azul con el metal y un shuriken grabado -->
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8ecf2"/>
      <stop offset="100%" stop-color="#9aa4b2"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#1e3a8a"/>
  <rect x="4" y="14" width="56" height="36" rx="8" fill="url(#metal)"/>
  <rect x="4" y="14" width="56" height="6" rx="3" fill="#ffffff" opacity="0.55"/>

  <!-- Shuriken de cuatro puntas -->
  <g fill="#1f2937">
    <path d="M32 16 L38 29 L32 32 L26 29 Z"/>
    <path d="M48 32 L35 38 L32 32 L35 26 Z"/>
    <path d="M32 48 L26 35 L32 32 L38 35 Z"/>
    <path d="M16 32 L29 26 L32 32 L29 38 Z"/>
  </g>
  <circle cx="32" cy="32" r="3.4" fill="url(#metal)" stroke="#1f2937" stroke-width="1.6"/>
